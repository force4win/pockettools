<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PocketTools | Hitos Históricos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .add-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .form-row .input-group {
            flex: 1;
            min-width: 160px;
        }

        .form-row select {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            width: 100%;
        }

        .form-row select option {
            background: var(--bg-color, #0a0a0a);
        }

        .btn-add {
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 10px 24px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            margin-top: 4px;
        }

        .btn-add:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .filter-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 12px;
        }

        .btn-sort {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            gap: 8px;
            align-items: center;
            font-family: inherit;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-sort:hover {
            color: var(--text-color);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Timeline */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 24px;
            top: 20px;
            bottom: 20px;
            width: 2px;
            background: var(--border-color);
            z-index: 0;
        }

        .milestone-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            gap: 16px;
            position: relative;
            z-index: 1;
            transition: transform 0.2s, background 0.2s;
        }

        .milestone-card:hover {
            transform: translateX(4px);
        }

        .milestone-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--bg-color, #0f172a);
            border: 2px solid var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            flex-shrink: 0;
            box-shadow: 0 0 15px color-mix(in srgb, var(--primary-color) 30%, transparent);
            font-size: 1.1rem;
        }

        .milestone-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .milestone-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .milestone-date {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .milestone-desc {
            font-size: 1.05rem;
            line-height: 1.5;
            color: var(--text-color);
        }

        /* Counter Controls */
        .counter-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
            padding: 8px;
            border-radius: 12px;
            width: fit-content;
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
        }

        .counter-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-color, #10b981);
            min-width: 30px;
            text-align: center;
        }

        .counter-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .btn-milestone {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-color);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-milestone:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-milestone:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-milestone.btn-delete {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .btn-milestone.btn-delete:hover {
            background: rgba(239, 68, 68, 0.2);
        }

        .locked-badge {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 32px;
        }

        .empty-state i {
            font-size: 3rem;
            opacity: 0.3;
            margin-bottom: 12px;
        }

        @media (max-width: 600px) {
            .milestone-card {
                flex-direction: column;
                gap: 10px;
                padding: 12px;
            }

            .timeline::before {
                display: none;
            }

            .milestone-icon {
                display: none;
            }

            .counter-box {
                width: 100%;
                justify-content: space-between;
            }

            .form-row {
                flex-direction: column;
            }

            .image-modal-content {
                max-width: 95%;
            }
        }

        /* Image Thumbnail */
        .milestone-img-thumb {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid var(--border-color);
            transition: transform 0.2s;
            flex-shrink: 0;
            background: var(--bg-color);
        }

        .milestone-img-thumb:hover {
            transform: scale(1.05);
            border-color: var(--primary-color);
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            flex: 1;
        }

        .file-input-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
        }

        .btn-file {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .btn-file:hover {
            border-color: var(--primary-color);
            color: var(--text-color);
        }

        /* Image Modal */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }

        .image-modal.visible {
            display: flex;
            animation: fadeIn 0.3s;
        }

        .image-modal-content {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            object-fit: contain;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            z-index: 1001;
        }

        .modal-close:hover {
            color: #bbb;
        }
    </style>
</head>

<body>
    <div class="app-container tool-view active">
        <div class="tool-header">
            <a href="index.html" class="back-btn" aria-label="Volver">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="tool-title" style="flex:1;">Hitos Históricos</h2>
            <button id="theme-toggle" class="secondary-btn" aria-label="Cambiar Tema"
                style="padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div id="tool-content" style="flex: 1; display: flex; flex-direction: column;">
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 16px; font-size: 0.9rem;">
                Registro de eventos y contadores importantes
            </p>

            <!-- Add Milestone Panel -->
            <div class="add-panel">
                <div class="form-row">
                    <div class="input-group">
                        <label>Fecha del Evento</label>
                        <input type="date" id="inputDate" class="glass-input">
                    </div>
                    <div class="input-group">
                        <label>Tipo de Hito</label>
                        <select id="inputType">
                            <option value="simple">Evento Simple</option>
                            <option value="counter">Evento con Contador</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label>Descripción / Título del Hito</label>
                        <input type="text" id="inputDesc" class="glass-input"
                            placeholder="Ej: Lanzamiento de la versión 1.0...">
                    </div>
                </div>
                <!-- Image Input -->
                <div class="input-group">
                    <div class="file-input-wrapper">
                        <button class="btn-file" id="btnFileLabel">
                            <i class="fa-solid fa-camera"></i> Agregar Foto (Opcional)
                        </button>
                        <input type="file" id="inputImage" accept="image/*" capture="environment"
                            onchange="updateFileLabel()">
                    </div>
                </div>
                <button class="btn-add" onclick="processAndAddMilestone()">
                    <i class="fa-solid fa-circle-plus"></i> Agregar Hito
                </button>
            </div>

            <div class="filter-bar">
                <button class="btn-sort" onclick="toggleSort()">
                    <i class="fa-solid fa-arrow-down-up"></i> <span id="sortLabel">Más Recientes</span>
                </button>
            </div>

            <!-- Milestones Timeline -->
            <div id="timelineList" class="timeline"></div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="image-modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img class="image-modal-content" id="modalImg">
    </div>

    <script>
        // === Theme System ===
        const TOOL_ID = 'tiers';
        const themeBtn = document.getElementById('theme-toggle');

        function loadTheme() {
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            applyTheme(saved[TOOL_ID] || 'dark');
        }

        function toggleTheme() {
            const list = ['dark', 'light', 'matrix', 'kids', 'cyberpunk', 'nordic', 'forest'];
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            let current = saved[TOOL_ID] || 'dark';
            let idx = list.indexOf(current);
            if (idx === -1) idx = 0;
            const next = list[(idx + 1) % list.length];
            saved[TOOL_ID] = next;
            localStorage.setItem('pt_tool_themes', JSON.stringify(saved));
            applyTheme(next);
        }

        function applyTheme(theme) {
            if (theme === 'dark') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const icon = themeBtn.querySelector('i');
            icon.className = ''; icon.style.color = '';
            switch (theme) {
                case 'light': icon.className = 'fa-solid fa-sun'; icon.style.color = '#f59e0b'; break;
                case 'matrix': icon.className = 'fa-solid fa-terminal'; icon.style.color = '#00ff41'; break;
                case 'kids': icon.className = 'fa-solid fa-shapes'; icon.style.color = '#ef4444'; break;
                case 'cyberpunk': icon.className = 'fa-solid fa-robot'; icon.style.color = '#00ffff'; break;
                case 'nordic': icon.className = 'fa-regular fa-snowflake'; icon.style.color = '#88c0d0'; break;
                case 'forest': icon.className = 'fa-solid fa-tree'; icon.style.color = '#95d5b2'; break;
                default: icon.className = 'fa-solid fa-moon'; break;
            }
        }

        themeBtn.addEventListener('click', toggleTheme);
        loadTheme();

        // === Data ===
        let milestones = JSON.parse(localStorage.getItem('pt_milestones') || '[]');
        let sortDesc = true;

        // Set default date to today
        document.getElementById('inputDate').valueAsDate = new Date();

        function save() {
            try {
                localStorage.setItem('pt_milestones', JSON.stringify(milestones));
            } catch (e) {
                if (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') {
                    alert('⚠️ No se pudo guardar: Espacio insuficiente.\n\nLa imagen es muy pesada o tienes demasiados datos guardados. Intenta con una foto más pequeña o borra hitos antiguos.');
                } else {
                    console.error('Error al guardar:', e);
                    alert('Error al guardar datos. Revisa la consola.');
                }
            }
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function updateFileLabel() {
            const input = document.getElementById('inputImage');
            const label = document.getElementById('btnFileLabel');
            if (input.files && input.files[0]) {
                label.innerHTML = `<i class="fa-solid fa-check"></i> ${input.files[0].name}`;
                label.style.color = 'var(--primary-color)';
                label.style.borderColor = 'var(--primary-color)';
            } else {
                label.innerHTML = `<i class="fa-solid fa-camera"></i> Agregar Foto (Opcional)`;
                label.style.color = '';
                label.style.borderColor = '';
            }
        }

        function compressImage(file, maxWidth, quality, callback) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = event => {
                const img = new Image();
                img.src = event.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;

                    if (width > maxWidth) {
                        height *= maxWidth / width;
                        width = maxWidth;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    // Compress to JPEG
                    const dataUrl = canvas.toDataURL('image/jpeg', quality);
                    callback(dataUrl);
                };
            };
        }

        function processAndAddMilestone() {
            const date = document.getElementById('inputDate').value;
            const desc = document.getElementById('inputDesc').value.trim();
            const type = document.getElementById('inputType').value;
            const fileInput = document.getElementById('inputImage');

            if (!date || !desc) {
                alert("Por favor completa la fecha y la descripción.");
                return;
            }

            // Check if there is an image
            if (fileInput.files && fileInput.files[0]) {
                // Compress: Max width 800px, 0.7 quality
                compressImage(fileInput.files[0], 800, 0.7, (compressedDataUrl) => {
                    addMilestone(date, desc, type, compressedDataUrl);
                });
            } else {
                addMilestone(date, desc, type, null);
            }
        }

        function addMilestone(date, desc, type, image) {
            milestones.push({
                id: generateId(),
                type: type,
                date: date,
                description: desc,
                count: 0,
                locked: false,
                image: image
            });

            save();
            render();

            // Clear inputs
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputImage').value = '';
            updateFileLabel();
        }

        function deleteMilestone(id) {
            if (confirm('¿Eliminar este hito?')) {
                milestones = milestones.filter(m => m.id !== id);
                save();
                render();
            }
        }

        function toggleLock(id) {
            const m = milestones.find(x => x.id === id);
            if (m) {
                m.locked = !m.locked;
                save();
                render();
            }
        }

        function updateCounter(id, change) {
            const m = milestones.find(x => x.id === id);
            if (m && !m.locked) {
                m.count = (m.count || 0) + change;
                if (m.count < 0) m.count = 0;
                save();
                render();
            }
        }

        function toggleSort() {
            sortDesc = !sortDesc;
            document.getElementById('sortLabel').innerText = sortDesc ? "Más Recientes" : "Más Antiguos";
            render();
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return dateStr;
        }

        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modal.classList.add('visible');
            modalImg.src = imgSrc;
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('visible');
        }

        function render() {
            const container = document.getElementById('timelineList');
            container.innerHTML = '';

            const sorted = [...milestones].sort((a, b) => {
                const dateA = new Date(a.date);
                const dateB = new Date(b.date);
                return sortDesc ? dateB - dateA : dateA - dateB;
            });

            if (sorted.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-clock-rotate-left"></i>
                        <p>No hay hitos registrados aún.</p>
                    </div>
                `;
                return;
            }

            sorted.forEach(m => {
                const card = document.createElement('div');
                card.className = 'milestone-card';

                const iconClass = m.type === 'counter' ? 'fa-solid fa-tally' : 'fa-solid fa-flag';

                let counterHtml = '';
                let lockBadge = '';

                if (m.type === 'counter') {
                    const isLocked = m.locked;
                    counterHtml = `
                        <div class="counter-box">
                            <span class="counter-label">Contador:</span>
                            <button class="btn-milestone" onclick="updateCounter('${m.id}', -1)" ${isLocked ? 'disabled' : ''}>
                                <i class="fa-solid fa-minus"></i>
                            </button>
                            <span class="counter-value">${m.count || 0}</span>
                            <button class="btn-milestone" onclick="updateCounter('${m.id}', 1)" ${isLocked ? 'disabled' : ''}>
                                <i class="fa-solid fa-plus"></i>
                            </button>
                            <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 6px;"></div>
                            <button class="btn-milestone" onclick="toggleLock('${m.id}')" title="${isLocked ? 'Desbloquear' : 'Bloquear'}">
                                <i class="fa-solid fa-${isLocked ? 'lock' : 'unlock'}" style="color: ${isLocked ? '#ef4444' : 'var(--text-muted)'}"></i>
                            </button>
                        </div>
                    `;

                    if (isLocked) {
                        lockBadge = `<span class="locked-badge"><i class="fa-solid fa-lock" style="font-size:10px;"></i> Bloqueado</span>`;
                    }
                }

                let imageHtml = '';
                if (m.image) {
                    imageHtml = `<img src="${m.image}" class="milestone-img-thumb" onclick="openModal('${m.image}')" alt="Foto">`;
                }

                card.innerHTML = `
                    <div class="milestone-icon">
                        <i class="${iconClass}"></i>
                    </div>
                    ${imageHtml}
                    <div class="milestone-content">
                        <div class="milestone-header">
                            <div>
                                <div class="milestone-date">${formatDate(m.date)}</div>
                                <div class="milestone-desc">${m.description} ${lockBadge}</div>
                            </div>
                            <button class="btn-milestone btn-delete" onclick="deleteMilestone('${m.id}')" title="Eliminar Hito">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                        ${counterHtml}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        // Initial render
        render();
    </script>
</body>

</html>
