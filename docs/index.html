<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PocketTools | Utilidades</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="app-container fade-in">
        <div style="position: absolute; top: 16px; right: 16px; z-index: 10;">
            <button id="theme-toggle" class="secondary-btn" aria-label="Cambiar Tema"
                style="padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
        <header>
            <div style="font-size: 3rem; margin-bottom: 16px;">
                <i class="fa-solid fa-toolbox"
                    style="background: linear-gradient(45deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
            </div>
            <h1>PocketTools</h1>
            <p class="subtitle">Tus herramientas esenciales, siempre a mano.</p>
        </header>

        <div id="tools-grid" class="tools-grid">
            <!-- Tools will be rendered here by app.js -->
        </div>

        <footer
            style="margin-top: auto; padding-top: 32px; text-align: center; color: var(--text-muted); font-size: 0.8rem;">
            <p>&copy; 2026 PocketTools. Todos los derechos reservados de ALV INC.</p>
        </footer>
    </div>

    <!-- Tool Detail View -->
    <div id="tool-container" class="app-container tool-view hidden">
        <div class="tool-header">
            <button class="back-btn" id="back-btn" aria-label="Volver">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <h2 class="tool-title" id="current-tool-title" style="flex:1;">Herramienta</h2>
            <button id="tool-theme-toggle" class="secondary-btn" aria-label="Cambiar Tema Herramienta"
                style="padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div id="tool-content" style="flex: 1; display: flex; flex-direction: column;">
            <!-- Tool Interface injected here -->
        </div>
    </div>

    <!-- TEMPLATES -->
    <template id="tool-notes">
        <div class="input-group">
            <textarea id="notes-area" class="glass-input" placeholder="Escribe tus ideas aquí..."
                style="height: 300px; resize: vertical;"></textarea>
            <div class="status-indicator">
                <span id="save-status">Guardado</span> <span class="saved-dot"></span>
            </div>
        </div>
    </template>

    <template id="tool-timer">
        <div
            style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 24px;">
            <!-- Inputs -->
            <div style="display: flex; gap: 12px; align-items: center;">
                <div class="input-group" style="text-align: center; margin:0;">
                    <label>Min</label>
                    <input type="number" id="timer-min" value="5" min="0" max="999"
                        style="width: 80px; text-align: center; font-size: 1.5rem;">
                </div>
                <span style="font-size: 2rem; font-weight: bold; margin-top: 14px;">:</span>
                <div class="input-group" style="text-align: center; margin:0;">
                    <label>Seg</label>
                    <input type="number" id="timer-sec" value="0" min="0" max="59"
                        style="width: 80px; text-align: center; font-size: 1.5rem;">
                </div>
            </div>

            <!-- Display -->
            <div id="timer-display" class="counter-display"
                style="font-family: monospace; font-size: 5rem; line-height: 1;">
                05:00
            </div>

            <!-- Controls -->
            <div class="counter-controls">
                <button id="btn-timer-reset" class="counter-btn btn-reset" title="Reiniciar">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
                <button id="btn-timer-toggle" class="counter-btn btn-plus"
                    style="width: 80px; height: 80px; font-size: 2rem;" title="Iniciar/Pausar">
                    <i class="fa-solid fa-play"></i>
                </button>
            </div>

            <p style="text-align:center; color: var(--text-muted); font-size: 0.9rem; margin-top: 16px;">
                <i class="fa-solid fa-volume-high"></i> La alarma sonará al finalizar.
            </p>
        </div>
    </template>

    <template id="tool-counter">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;">
            <div class="counter-display" id="counter-value">0</div>
            <div class="counter-controls">
                <button class="counter-btn btn-minus" id="btn-dec"><i class="fa-solid fa-minus"></i></button>
                <button class="counter-btn btn-reset" id="btn-reset"><i class="fa-solid fa-rotate-right"></i></button>
                <button class="counter-btn btn-plus" id="btn-inc"><i class="fa-solid fa-plus"></i></button>
            </div>
        </div>
    </template>

    <template id="tool-password">
        <div class="input-group">
            <div class="counter-display" id="pass-display"
                style="font-size: 2rem; margin: 20px 0; word-break: break-all; min-height: 60px;">---</div>
            <button class="primary-btn" id="generate-btn" style="margin-bottom: 24px;">
                <i class="fa-solid fa-shuffle"></i> Generar Nueva
            </button>

            <label>Longitud: <span id="len-val">12</span></label>
            <input type="range" id="pass-length" min="6" max="32" value="12">

            <div style="margin-top: 16px; display: grid; gap: 12px;">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="use-caps" checked style="width: auto;"> Mayúsculas (A-Z)
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="use-nums" checked style="width: auto;"> Números (0-9)
                </label>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="use-syms" style="width: auto;"> Símbolos (!@#$)
                </label>
            </div>
        </div>
    </template>

    <template id="tool-todo">
        <div class="input-group" style="display: flex; gap: 8px;">
            <input type="text" id="todo-input" placeholder="Nueva tarea...">
            <button class="primary-btn" id="todo-add" style="width: auto;"><i class="fa-solid fa-plus"></i></button>
        </div>
        <ul id="todo-list" style="list-style: none; padding: 0;"></ul>
    </template>

    <template id="tool-converter">
        <div class="input-group">
            <label>Tipo</label>
            <select id="conv-type">
                <option value="length">Longitud (m/ft)</option>
                <option value="weight">Peso (kg/lb)</option>
                <option value="temp">Temperatura (C/F)</option>
            </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: center;">
            <div class="input-group">
                <label id="label-a">Metros</label>
                <input type="number" id="input-a" placeholder="0">
            </div>
            <div style="text-align: center; font-size: 1.5rem; color: var(--text-muted); padding-top: 12px;">
                <i class="fa-solid fa-arrow-right-arrow-left"></i>
            </div>
            <div class="input-group">
                <label id="label-b">Pies</label>
                <input type="number" id="input-b" placeholder="0">
            </div>
        </div>
    </template>

    <template id="tool-fuel">
        <div style="display: grid; gap: 16px;">
            <input type="datetime-local" id="fuel-date" class="glass-input" step="1">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="input-group">
                    <label>Km Recorridos</label>
                    <input type="number" id="fuel-dist" placeholder="0">
                </div>
                <div class="input-group">
                    <label>Galones</label>
                    <input type="number" id="fuel-gal" placeholder="0">
                </div>
            </div>
            <div class="input-group">
                <label>Costo Total ($)</label>
                <input type="number" id="fuel-cost" placeholder="$">
            </div>
            <button class="primary-btn" id="fuel-add-btn">
                <i class="fa-solid fa-plus"></i> Guardar Tanqueo
            </button>
        </div>

        <div style="margin-top: 32px; flex: 1; display: flex; flex-direction: column;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                <h3 style="margin: 0;">Historial</h3>
                <button class="secondary-btn" id="fuel-reset-btn" style="padding: 4px 12px; font-size: 0.8rem;">
                    <i class="fa-solid fa-scissors"></i> Cerrar Periodo
                </button>
            </div>
            <div style="overflow-y: auto; flex: 1; padding-right: 4px;">
                <table class="glass-table">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th id="th-km">Km</th>
                            <th id="th-gal">Gal</th>
                            <th id="th-eff">Km/Gal</th>
                            <th id="th-cost">$$$</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="fuel-list"></tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="tool-sudoku">
        <div style="display: flex; flex-direction: column; gap: 24px;">

            <!-- Mode Tabs -->
            <div
                style="display: flex; gap: 12px; border-bottom: 1px solid var(--surface-border); padding-bottom: 12px;">
                <button id="tab-play" class="secondary-btn"
                    style="flex:1; background: var(--surface-border);">Jugar</button>
                <button id="tab-gen" class="secondary-btn" style="flex:1;">Generador PDF</button>
            </div>

            <!-- PLAY MODE -->
            <div id="view-play" style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
                <div style="display: flex; justify-content: space-between; width: 100%; align-items: center;">
                    <div>
                        <label style="margin:0; font-size: 0.8rem;">Dificultad</label>
                        <select id="game-difficulty" style="padding: 4px 8px; width: auto;">
                            <option value="30">Fácil</option>
                            <option value="45">Medio</option>
                            <option value="55">Difícil</option>
                        </select>
                    </div>
                    <button id="btn-new-game" class="primary-btn"
                        style="width: auto; padding: 6px 16px; font-size: 0.9rem;">
                        <i class="fa-solid fa-rotate"></i> Nuevo
                    </button>
                </div>

                <!-- Board Container -->
                <div id="sudoku-board"
                    style="display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; background: var(--text-muted); padding: 2px; border-radius: 4px; width: 100%; max-width: 400px; aspect-ratio: 1;">
                    <!-- Cells generated by JS -->
                </div>

                <!-- Controls -->
                <div
                    style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 400px;">
                    <button class="num-btn secondary-btn" data-num="1">1</button>
                    <button class="num-btn secondary-btn" data-num="2">2</button>
                    <button class="num-btn secondary-btn" data-num="3">3</button>
                    <button class="num-btn secondary-btn" data-num="4">4</button>
                    <button class="num-btn secondary-btn" data-num="5">5</button>
                    <button class="num-btn secondary-btn" data-num="6">6</button>
                    <button class="num-btn secondary-btn" data-num="7">7</button>
                    <button class="num-btn secondary-btn" data-num="8">8</button>
                    <button class="num-btn secondary-btn" data-num="9">9</button>
                    <button class="num-btn secondary-btn" data-num="0" style="color: #ef4444;"><i
                            class="fa-solid fa-eraser"></i></button>
                </div>
            </div>

            <!-- GENERATOR MODE -->
            <div id="view-gen" style="display: none; flex-direction: column; gap: 16px;">
                <div class="input-group">
                    <label>Cantidad de Sudokus</label>
                    <input type="number" id="gen-count" value="1" min="1" max="50">
                </div>
                <div class="input-group">
                    <label>Números a Eliminar (Dificultad)</label>
                    <input type="number" id="gen-rem" value="45" min="20" max="64">
                </div>
                <div class="input-group">
                    <label>Número Inicial (Para título)</label>
                    <input type="number" id="gen-start" value="1">
                </div>
                <button class="primary-btn" id="btn-gen-pdf">
                    <i class="fa-solid fa-file-pdf"></i> Generar PDF
                </button>
            </div>

        </div>
    </template>

    <template id="tool-tasks">
        <div style="display: flex; flex-direction: column; gap: 16px; height: 100%;">
            <!-- Tabs -->
            <div
                style="display: flex; gap: 12px; border-bottom: 1px solid var(--surface-border); padding-bottom: 12px;">
                <button id="tab-tasks-list" class="secondary-btn"
                    style="flex:1; background: var(--surface-border);">Lista</button>
                <button id="tab-tasks-stats" class="secondary-btn" style="flex:1;">Estadísticas</button>
            </div>

            <!-- VIEW: LIST -->
            <div id="view-tasks-list" style="display: flex; flex-direction: column; gap: 16px; flex: 1;">
                <div class="input-group" style="display: flex; gap: 8px; margin-bottom: 0;">
                    <input type="text" id="new-task-input" placeholder="Nueva tarea..." style="flex:1;">
                    <button id="add-task-btn" class="primary-btn" style="width: auto; padding: 0 20px;">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>

                <div style="flex: 1; overflow-y: auto;">
                    <ul id="task-list" style="list-style: none; padding: 0;"></ul>
                </div>

                <div class="stats" style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                    Tareas hoy: <span id="completed-today-count"
                        style="color: var(--text-color); font-weight: bold;">0</span>
                </div>

                <button id="btn-test-data" class="secondary-btn"
                    style="display: none; width: 100%; border-style: dashed; opacity: 0.7;">
                    🎲 Generar Datos Prueba
                </button>
            </div>

            <!-- VIEW: STATS -->
            <div id="view-tasks-stats"
                style="display: none; flex-direction: column; gap: 16px; flex: 1; overflow-y: auto;">

                <div class="date-filters" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                    <div class="input-group" style="margin:0;">
                        <label>Desde</label>
                        <input type="date" id="stats-start">
                    </div>
                    <div class="input-group" style="margin:0;">
                        <label>Hasta</label>
                        <input type="date" id="stats-end">
                    </div>
                </div>

                <div style="display: flex; gap: 8px;">
                    <button id="btn-filter-today" class="secondary-btn" style="flex:1;">Hoy</button>
                    <button id="btn-filter-apply" class="primary-btn" style="flex:1;">Filtrar</button>
                </div>

                <div class="chart-container"
                    style="background: var(--input-bg); padding: 12px; border-radius: var(--radius); height: 250px;">
                    <canvas id="stats-chart"></canvas>
                </div>

                <div style="overflow-x: auto;">
                    <table class="glass-table" id="stats-table">
                        <!-- Populated by JS -->
                    </table>
                </div>

                <button id="btn-export-csv" class="secondary-btn" style="width: 100%;">
                    <i class="fa-solid fa-file-csv"></i> Exportar Reporte
                </button>
            </div>
        </div>
    </template>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>

</html>
