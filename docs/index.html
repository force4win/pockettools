<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PocketTools | Utilidades</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="app-container fade-in">
        <div style="position: absolute; top: 16px; right: 16px; z-index: 10;">
            <button id="theme-toggle" class="secondary-btn" aria-label="Cambiar Tema"
                style="padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
        <header>
            <div style="font-size: 3rem; margin-bottom: 16px;">
                <i class="fa-solid fa-toolbox"
                    style="background: linear-gradient(45deg, #3b82f6, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
            </div>
            <h1>PocketTools</h1>
            <p class="subtitle">Tus herramientas esenciales, siempre a mano.</p>
        </header>

        <div id="tools-grid" class="tools-grid">
            <a href="notes.html" class="tool-card">
                <i class="fa-regular fa-note-sticky tool-icon"></i>
                <div class="tool-name">Notas Rápidas</div>
            </a>
            <a href="counter.html" class="tool-card">
                <i class="fa-solid fa-stopwatch tool-icon"></i>
                <div class="tool-name">Contador</div>
            </a>
            <a href="password.html" class="tool-card">
                <i class="fa-solid fa-key tool-icon"></i>
                <div class="tool-name">Generador Pass</div>
            </a>
            <a href="todo.html" class="tool-card">
                <i class="fa-solid fa-check-double tool-icon"></i>
                <div class="tool-name">Lista Tareas</div>
            </a>
            <a href="converter.html" class="tool-card">
                <i class="fa-solid fa-arrow-right-arrow-left tool-icon"></i>
                <div class="tool-name">Conversor</div>
            </a>
            <a href="fuel.html" class="tool-card">
                <i class="fa-solid fa-gas-pump tool-icon"></i>
                <div class="tool-name">Control Gasolina</div>
            </a>
            <a href="sudoku.html" class="tool-card">
                <i class="fa-solid fa-chess-board tool-icon"></i>
                <div class="tool-name">Sudoku Master</div>
            </a>
            <a href="tasks.html" class="tool-card">
                <i class="fa-solid fa-list-check tool-icon"></i>
                <div class="tool-name">Tareas & Estadísticas</div>
            </a>
            <a href="timer.html" class="tool-card">
                <i class="fa-solid fa-hourglass-half tool-icon"></i>
                <div class="tool-name">Cuenta Regresiva</div>
            </a>
        </div>

        <footer
            style="margin-top: auto; padding-top: 32px; text-align: center; color: var(--text-muted); font-size: 0.8rem;">
            <p>&copy; 2026 PocketTools. Todos los derechos reservados de ALV INC.</p>
        </footer>
    </div>

    <!-- Dashboard Theme Script -->
    <script>
        const themeBtn = document.getElementById('theme-toggle');

        function loadTheme() {
            const saved = localStorage.getItem('pt_theme') || 'dark';
            applyTheme(saved);
        }

        function toggleTheme() {
            const list = ['dark', 'light', 'matrix', 'kids', 'cyberpunk', 'nordic', 'forest'];
            let current = localStorage.getItem('pt_theme') || 'dark';
            let idx = list.indexOf(current);
            if (idx === -1) idx = 0;
            const next = list[(idx + 1) % list.length];
            localStorage.setItem('pt_theme', next);
            applyTheme(next);
        }

        function applyTheme(theme) {
            if (theme === 'dark') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const icon = themeBtn.querySelector('i');
            icon.className = ''; icon.style.color = '';
            switch (theme) {
                case 'light': icon.className = 'fa-solid fa-sun'; icon.style.color = '#f59e0b'; break;
                case 'matrix': icon.className = 'fa-solid fa-terminal'; icon.style.color = '#00ff41'; break;
                case 'kids': icon.className = 'fa-solid fa-shapes'; icon.style.color = '#ef4444'; break;
                case 'cyberpunk': icon.className = 'fa-solid fa-robot'; icon.style.color = '#00ffff'; break;
                case 'nordic': icon.className = 'fa-regular fa-snowflake'; icon.style.color = '#88c0d0'; break;
                case 'forest': icon.className = 'fa-solid fa-tree'; icon.style.color = '#95d5b2'; break;
                default: icon.className = 'fa-solid fa-moon'; break;
            }
        }

        themeBtn.addEventListener('click', toggleTheme);
        loadTheme();
    </script>
</body>

</html>
