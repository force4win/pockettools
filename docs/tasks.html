<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PocketTools | Tareas &amp; Estadísticas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Task Type Selector */
        .type-selector {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 14px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
            margin-bottom: 8px;
        }

        .type-selector option {
            background: var(--bg-color, #0a0a0a);
        }

        /* Counter Controls */
        .counter-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .count-btn {
            width: 30px;
            height: 30px;
            min-height: 30px;
            padding: 0;
            border-radius: 8px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--primary-color);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-family: inherit;
        }

        .count-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        .count-val {
            font-weight: 700;
            min-width: 20px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            color: var(--primary-color);
        }

        /* Task Item enhanced */
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            background: var(--surface-color, var(--card-bg));
            padding: 12px;
            border-radius: 10px;
            transition: all 0.2s;
            cursor: grab;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-item.is-counter .task-text {
            text-decoration: none !important;
            color: var(--text-color) !important;
        }

        .task-item.dragging {
            opacity: 0.3;
            transform: scale(0.98);
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .task-text {
            flex: 1;
        }

        /* Custom Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: var(--card-bg, #1c1c1e);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: modalPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalPop {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .modal p {
            margin: 0 0 20px 0;
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .modal-btns {
            display: flex;
            gap: 12px;
        }

        .modal-btns button {
            flex: 1;
            height: 44px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .modal-cancel {
            background: var(--surface-color, #2c2c2e);
            color: var(--text-color);
        }

        .modal-confirm {
            background: #ef4444;
            color: white;
        }

        .btn-danger-outline {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 10px;
            border-radius: 12px;
            width: 100%;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .btn-danger-outline:hover {
            background: #ef4444;
            color: white;
        }
    </style>
</head>

<body>
    <div class="app-container tool-view active">
        <div class="tool-header">
            <a href="index.html" class="back-btn" aria-label="Volver">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="tool-title" style="flex:1;">Tareas &amp; Estadísticas</h2>
            <button id="theme-toggle" class="secondary-btn" aria-label="Cambiar Tema"
                style="padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div id="tool-content" style="flex: 1; display: flex; flex-direction: column;">
            <div style="display: flex; flex-direction: column; gap: 16px; height: 100%;">
                <!-- Tabs -->
                <div
                    style="display: flex; gap: 12px; border-bottom: 1px solid var(--surface-border); padding-bottom: 12px;">
                    <button id="tab-tasks-list" class="secondary-btn"
                        style="flex:1; background: var(--surface-border);">Lista</button>
                    <button id="tab-tasks-stats" class="secondary-btn" style="flex:1;">Estadísticas</button>
                </div>

                <!-- VIEW: LIST -->
                <div id="view-tasks-list" style="display: flex; flex-direction: column; gap: 10px; flex: 1;">
                    <select id="taskType" class="type-selector">
                        <option value="check">✔ Tipo: Check (completar)</option>
                        <option value="counter">🔢 Tipo: Contador (+/-)</option>
                    </select>

                    <div class="input-group" style="display: flex; gap: 8px; margin-bottom: 0;">
                        <input type="text" id="new-task-input" placeholder="Nueva tarea..." style="flex:1;">
                        <button id="add-task-btn" class="primary-btn" style="width: auto; padding: 0 20px;">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>

                    <div style="flex: 1; overflow-y: auto;">
                        <div id="task-list"></div>
                    </div>

                    <div class="stats" style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">
                        Tareas hoy: <span id="completed-today-count"
                            style="color: var(--text-color); font-weight: bold;">0</span>
                    </div>

                    <button id="btn-test-data" class="secondary-btn"
                        style="display: none; width: 100%; border-style: dashed; opacity: 0.7;">
                        🎲 Generar Datos Prueba
                    </button>
                </div>

                <!-- VIEW: STATS -->
                <div id="view-tasks-stats"
                    style="display: none; flex-direction: column; gap: 16px; flex: 1; overflow-y: auto;">
                    <div class="date-filters" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                        <div class="input-group" style="margin:0;">
                            <label>Desde</label>
                            <input type="date" id="stats-start">
                        </div>
                        <div class="input-group" style="margin:0;">
                            <label>Hasta</label>
                            <input type="date" id="stats-end">
                        </div>
                    </div>

                    <div style="display: flex; gap: 8px;">
                        <button id="btn-filter-today" class="secondary-btn" style="flex:1;">Hoy</button>
                        <button id="btn-filter-apply" class="primary-btn" style="flex:1;">Filtrar</button>
                    </div>

                    <!-- Check Tasks Chart -->
                    <div class="chart-container"
                        style="background: var(--input-bg); padding: 12px; border-radius: var(--radius); height: 250px;">
                        <canvas id="stats-chart-check"></canvas>
                    </div>

                    <!-- Counter Tasks Chart -->
                    <div class="chart-container" id="counter-chart-container"
                        style="background: var(--input-bg); padding: 12px; border-radius: var(--radius); height: 250px; display: none;">
                        <canvas id="stats-chart-counter"></canvas>
                    </div>

                    <div style="overflow-x: auto;">
                        <table class="glass-table" id="stats-table">
                            <!-- Populated by JS -->
                        </table>
                    </div>

                    <button id="btn-export-csv" class="secondary-btn" style="width: 100%;">
                        <i class="fa-solid fa-file-csv"></i> Exportar Reporte
                    </button>

                    <button class="btn-danger-outline" id="btn-delete-range">
                        <i class="fa-solid fa-trash"></i> Borrar Rango de Datos
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle">¿Eliminar tarea?</h3>
            <p id="modalMessage">Esta acción no se puede deshacer.</p>
            <div class="modal-btns">
                <button id="modalCancel" class="modal-cancel">Cancelar</button>
                <button id="modalConfirm" class="modal-confirm">Eliminar</button>
            </div>
        </div>
    </div>

    <script>
        // === Theme System ===
        const TOOL_ID = 'tasks';
        const themeBtn = document.getElementById('theme-toggle');

        function loadTheme() {
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            applyTheme(saved[TOOL_ID] || 'dark');
        }

        function toggleTheme() {
            const list = ['dark', 'light', 'matrix', 'kids', 'cyberpunk', 'nordic', 'forest'];
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            let current = saved[TOOL_ID] || 'dark';
            let idx = list.indexOf(current);
            if (idx === -1) idx = 0;
            const next = list[(idx + 1) % list.length];
            saved[TOOL_ID] = next;
            localStorage.setItem('pt_tool_themes', JSON.stringify(saved));
            applyTheme(next);
        }

        function applyTheme(theme) {
            if (theme === 'dark') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const icon = themeBtn.querySelector('i');
            icon.className = ''; icon.style.color = '';
            switch (theme) {
                case 'light': icon.className = 'fa-solid fa-sun'; icon.style.color = '#f59e0b'; break;
                case 'matrix': icon.className = 'fa-solid fa-terminal'; icon.style.color = '#00ff41'; break;
                case 'kids': icon.className = 'fa-solid fa-shapes'; icon.style.color = '#ef4444'; break;
                case 'cyberpunk': icon.className = 'fa-solid fa-robot'; icon.style.color = '#00ffff'; break;
                case 'nordic': icon.className = 'fa-regular fa-snowflake'; icon.style.color = '#88c0d0'; break;
                case 'forest': icon.className = 'fa-solid fa-tree'; icon.style.color = '#95d5b2'; break;
                default: icon.className = 'fa-solid fa-moon'; break;
            }
        }

        themeBtn.addEventListener('click', toggleTheme);
        loadTheme();

        // === Custom Modal ===
        function showConfirm(title, message, callback) {
            const overlay = document.getElementById('confirmModal');
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMessage').textContent = message;
            overlay.classList.add('show');

            const cleanup = () => overlay.classList.remove('show');

            document.getElementById('modalConfirm').onclick = () => {
                cleanup();
                callback();
            };
            document.getElementById('modalCancel').onclick = cleanup;
        }

        // === Tool Logic ===
        const tabList = document.getElementById('tab-tasks-list');
        const tabStats = document.getElementById('tab-tasks-stats');
        const viewList = document.getElementById('view-tasks-list');
        const viewStats = document.getElementById('view-tasks-stats');

        const taskInput = document.getElementById('new-task-input');
        const taskTypeSelect = document.getElementById('taskType');
        const addTaskBtn = document.getElementById('add-task-btn');
        const taskListEl = document.getElementById('task-list');
        const todayCountEl = document.getElementById('completed-today-count');
        const testBtn = document.getElementById('btn-test-data');

        const startInput = document.getElementById('stats-start');
        const endInput = document.getElementById('stats-end');
        const filterTodayBtn = document.getElementById('btn-filter-today');
        const filterApplyBtn = document.getElementById('btn-filter-apply');
        const exportBtn = document.getElementById('btn-export-csv');
        const deleteRangeBtn = document.getElementById('btn-delete-range');
        const statsTable = document.getElementById('stats-table');

        let statsChartCheckInstance = null;
        let statsChartCounterInstance = null;

        // State - compatible with existing localStorage keys
        let tasks = JSON.parse(localStorage.getItem("pt_tasks")) || [];
        let stats = JSON.parse(localStorage.getItem("pt_tasks_stats")) || {
            completedToday: 0,
            completedTotal: 0,
            lastDate: getToday(),
            history: {}
        };

        // Migrate old tasks without type
        tasks.forEach(t => {
            if (!t.type) t.type = 'check';
            if (t.type === 'counter' && t.count === undefined) t.count = 0;
        });

        function getToday(d = new Date()) {
            return new Intl.DateTimeFormat('sv-SE', { timeZone: 'America/Bogota' }).format(d);
        }

        function saveData() {
            localStorage.setItem("pt_tasks", JSON.stringify(tasks));
            localStorage.setItem("pt_tasks_stats", JSON.stringify(stats));
        }

        // Check new day
        if (stats.lastDate !== getToday()) {
            tasks.forEach(t => {
                t.completed = false;
                if (t.type === 'counter') t.count = 0;
            });
            stats.completedToday = 0;
            stats.lastDate = getToday();
            saveData();
        }

        // --- TABS ---
        const switchTab = (mode) => {
            if (mode === 'list') {
                viewList.style.display = 'flex';
                viewStats.style.display = 'none';
                tabList.style.background = 'var(--surface-border)';
                tabStats.style.background = 'transparent';
            } else {
                viewList.style.display = 'none';
                viewStats.style.display = 'flex';
                tabList.style.background = 'transparent';
                tabStats.style.background = 'var(--surface-border)';
                renderStats();
            }
        };
        tabList.onclick = () => switchTab('list');
        tabStats.onclick = () => switchTab('stats');

        // --- LIST LOGIC ---
        const renderTasks = () => {
            taskListEl.innerHTML = "";
            tasks.forEach((task, index) => {
                const item = document.createElement("div");
                item.className = `task-item ${task.completed ? 'completed' : ''} ${task.type === 'counter' ? 'is-counter' : ''}`;
                item.draggable = true;
                item._task = task;

                if (task.type === 'counter' && (task.count || 0) > 0) {
                    item.classList.add('completed');
                }

                const leftDiv = document.createElement('div');
                leftDiv.className = 'task-left';

                if (task.type === 'counter') {
                    // Counter controls on left side
                    const controls = document.createElement('div');
                    controls.className = 'counter-controls';

                    const minusBtn = document.createElement('button');
                    minusBtn.className = 'count-btn';
                    minusBtn.textContent = '−';
                    minusBtn.onclick = () => {
                        if (task.count > 0) {
                            task.count--;
                            if (task.count === 0) stats.completedToday--;
                            if (!stats.history[getToday()]) stats.history[getToday()] = {};
                            stats.history[getToday()][task.text] = task.count;
                            saveData();
                            renderTasks();
                        }
                    };

                    const countDisplay = document.createElement('span');
                    countDisplay.className = 'count-val';
                    countDisplay.textContent = task.count || 0;

                    const plusBtn = document.createElement('button');
                    plusBtn.className = 'count-btn';
                    plusBtn.textContent = '+';
                    plusBtn.onclick = () => {
                        const wasZero = (task.count || 0) === 0;
                        task.count = (task.count || 0) + 1;
                        if (wasZero) stats.completedToday++;
                        if (!stats.history[getToday()]) stats.history[getToday()] = {};
                        stats.history[getToday()][task.text] = task.count;
                        saveData();
                        renderTasks();
                    };

                    controls.appendChild(minusBtn);
                    controls.appendChild(countDisplay);
                    controls.appendChild(plusBtn);
                    leftDiv.appendChild(controls);
                } else {
                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.checked = task.completed;
                    checkbox.style.cssText = 'width: 20px; height: 20px; accent-color: var(--primary-color); cursor: pointer;';

                    checkbox.onchange = () => {
                        task.completed = checkbox.checked;
                        const today = getToday();
                        if (checkbox.checked) {
                            stats.completedToday++;
                            stats.completedTotal++;
                            if (!stats.history[today]) stats.history[today] = {};
                            stats.history[today][task.text] = true;
                        } else {
                            stats.completedToday--;
                            if (stats.history[today]) stats.history[today][task.text] = false;
                        }
                        saveData();
                        renderTasks();
                    };
                    leftDiv.appendChild(checkbox);
                }

                const span = document.createElement("span");
                span.textContent = task.text;
                span.className = 'task-text';
                leftDiv.appendChild(span);

                const delBtn = document.createElement("button");
                delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                delBtn.className = 'delete-btn-sm';
                delBtn.style.fontSize = '1.1rem';
                delBtn.onclick = () => {
                    showConfirm(
                        "¿Eliminar tarea?",
                        `¿Eliminar "${task.text}"? Esta acción no se puede deshacer.`,
                        () => {
                            if (task.type === 'counter') {
                                if (task.count > 0) stats.completedToday--;
                            } else {
                                if (task.completed) stats.completedToday--;
                            }
                            tasks.splice(index, 1);
                            saveData();
                            renderTasks();
                        }
                    );
                };

                // Drag
                item.ondragstart = (e) => {
                    item.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                };
                item.ondragend = () => {
                    item.classList.remove('dragging');
                    realSaveOrder();
                };

                item.appendChild(leftDiv);
                item.appendChild(delBtn);
                taskListEl.appendChild(item);
            });

            todayCountEl.textContent = stats.completedToday;
        };

        // Drag Over Logic
        taskListEl.ondragover = (e) => {
            e.preventDefault();
            const dragging = document.querySelector('.dragging');
            const siblings = [...taskListEl.querySelectorAll('.task-item:not(.dragging)')];
            const next = siblings.find(sib => {
                return e.clientY <= sib.getBoundingClientRect().top + sib.offsetHeight / 2;
            });
            taskListEl.insertBefore(dragging, next);
        };

        const realSaveOrder = () => {
            const newTasks = [];
            taskListEl.querySelectorAll('.task-item').forEach(item => {
                if (item._task) newTasks.push(item._task);
            });
            tasks = newTasks;
            saveData();
        };

        addTaskBtn.onclick = () => {
            const val = taskInput.value.trim();
            if (val) {
                const type = taskTypeSelect.value;
                tasks.push({ text: val, completed: false, type, count: 0 });
                taskInput.value = '';
                saveData();
                renderTasks();
            }
        };

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTaskBtn.click();
        });

        // Test Data Gen
        taskInput.oninput = () => {
            testBtn.style.display = taskInput.value.toLowerCase().trim() === 'test' ? 'block' : 'none';
        };

        testBtn.onclick = () => {
            if (tasks.length === 0) {
                tasks.push({ text: "Aprender JS", completed: false, type: 'check', count: 0 });
                tasks.push({ text: "Hacer ejercicio", completed: false, type: 'check', count: 0 });
                tasks.push({ text: "Vasos de agua", completed: false, type: 'counter', count: 0 });
            }
            const today = new Date();
            for (let i = 0; i < 5; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() - i);
                const dayStr = getToday(d);
                if (!stats.history[dayStr]) stats.history[dayStr] = {};
                tasks.forEach(t => {
                    if (t.type === 'counter') {
                        stats.history[dayStr][t.text] = Math.floor(Math.random() * 8);
                    } else {
                        stats.history[dayStr][t.text] = Math.random() > 0.5;
                    }
                });
            }
            saveData();
            renderTasks();
            alert('Datos de prueba generados');
        };

        // --- STATS LOGIC ---
        const renderStats = () => {
            if (!window.Chart) return;

            const start = startInput.value;
            const end = endInput.value;

            const days = Object.keys(stats.history).sort().filter(day => {
                if (start && day < start) return false;
                if (end && day > end) return false;
                return true;
            });

            const checkTasks = tasks.filter(t => t.type !== 'counter');
            const counterTasks = tasks.filter(t => t.type === 'counter');

            // Check Tasks Chart
            const checkLabels = checkTasks.map(t => t.text);
            const checkCounts = checkTasks.map(task => {
                let count = 0;
                days.forEach(day => {
                    if (stats.history[day] && stats.history[day][task.text] === true) count++;
                });
                return count;
            });

            const ctxCheck = document.getElementById('stats-chart-check').getContext('2d');
            if (statsChartCheckInstance) statsChartCheckInstance.destroy();

            statsChartCheckInstance = new Chart(ctxCheck, {
                type: 'bar',
                plugins: [ChartDataLabels],
                data: {
                    labels: checkLabels,
                    datasets: [{
                        label: 'Completado',
                        data: checkCounts,
                        backgroundColor: '#3b82f6',
                        borderRadius: 4,
                        barThickness: 20
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        title: { display: true, text: 'Tareas Check', color: '#94a3b8', font: { size: 12 } },
                        datalabels: {
                            color: '#fff',
                            anchor: 'end',
                            align: 'end',
                            formatter: (v) => v > 0 ? v : ''
                        }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#cbd5e1' } }
                    }
                }
            });

            // Counter Tasks Chart
            const counterContainer = document.getElementById('counter-chart-container');
            if (counterTasks.length > 0) {
                counterContainer.style.display = 'block';
                const counterLabels = counterTasks.map(t => t.text);
                const counterTotalCounts = counterTasks.map(task => {
                    let total = 0;
                    days.forEach(day => {
                        const val = stats.history[day] && stats.history[day][task.text];
                        if (typeof val === 'number') total += val;
                    });
                    return total;
                });

                const ctxCounter = document.getElementById('stats-chart-counter').getContext('2d');
                if (statsChartCounterInstance) statsChartCounterInstance.destroy();

                statsChartCounterInstance = new Chart(ctxCounter, {
                    type: 'bar',
                    plugins: [ChartDataLabels],
                    data: {
                        labels: counterLabels,
                        datasets: [{
                            label: 'Total Acumulado',
                            data: counterTotalCounts,
                            backgroundColor: '#10b981',
                            borderRadius: 4,
                            barThickness: 20
                        }]
                    },
                    options: {
                        indexAxis: 'y',
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            title: { display: true, text: 'Tareas Contador', color: '#94a3b8', font: { size: 12 } },
                            datalabels: {
                                color: '#fff',
                                anchor: 'end',
                                align: 'end',
                                formatter: (v) => v > 0 ? v : ''
                            }
                        },
                        scales: {
                            x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
                            y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#cbd5e1' } }
                        }
                    }
                });
            } else {
                counterContainer.style.display = 'none';
            }

            // Table
            statsTable.innerHTML = '';
            const headerRow = document.createElement('tr');
            headerRow.innerHTML = '<th>Tarea</th>' + days.map(d => `<th>${d.slice(5)}</th>`).join('');
            statsTable.appendChild(headerRow);

            tasks.forEach(task => {
                const tr = document.createElement('tr');
                let content = `<td>${task.text}</td>`;
                days.forEach(d => {
                    const val = stats.history[d] && stats.history[d][task.text];
                    if (task.type === 'counter') {
                        const num = typeof val === 'number' ? val : 0;
                        content += `<td style="color: ${num > 0 ? 'var(--primary-color)' : 'var(--text-muted)'}; text-align: center; font-weight: ${num > 0 ? '600' : '400'};">${num > 0 ? num : '·'}</td>`;
                    } else {
                        const done = val === true;
                        content += `<td style="color: ${done ? 'var(--primary-color)' : 'var(--text-muted)'}; text-align: center;">${done ? '<i class="fa-solid fa-check"></i>' : '·'}</td>`;
                    }
                });
                tr.innerHTML = content;
                statsTable.appendChild(tr);
            });
        };

        // Filters
        filterApplyBtn.onclick = renderStats;
        filterTodayBtn.onclick = () => {
            const t = getToday();
            startInput.value = t;
            endInput.value = t;
            renderStats();
        };

        // Delete Range
        deleteRangeBtn.onclick = () => {
            const start = startInput.value;
            const end = endInput.value;

            if (!start && !end) {
                alert('Selecciona un rango de fechas primero.');
                return;
            }

            const daysToDelete = Object.keys(stats.history).filter(day => {
                if (start && day < start) return false;
                if (end && day > end) return false;
                return true;
            });

            if (daysToDelete.length === 0) {
                alert('No hay datos en el rango seleccionado.');
                return;
            }

            const rangeMsg = (start && end) ? `entre ${start} y ${end}` : (start ? `desde ${start}` : `hasta ${end}`);
            showConfirm(
                "¿Borrar datos?",
                `Se borrarán ${daysToDelete.length} día(s) de estadísticas ${rangeMsg}. Esta acción no se puede deshacer.`,
                () => {
                    daysToDelete.forEach(day => delete stats.history[day]);
                    saveData();
                    renderStats();
                }
            );
        };

        // Export
        exportBtn.onclick = () => {
            const start = startInput.value;
            const end = endInput.value;
            const days = Object.keys(stats.history).sort().filter(day => {
                if (start && day < start) return false;
                if (end && day > end) return false;
                return true;
            });

            let csv = "Tarea,Tipo," + days.join(",") + "\n";
            tasks.forEach(task => {
                let row = `"${task.text}","${task.type || 'check'}"`;
                days.forEach(day => {
                    const val = stats.history[day] && stats.history[day][task.text];
                    if (task.type === 'counter') {
                        row += "," + (typeof val === 'number' ? val : 0);
                    } else {
                        row += "," + (val === true ? "SI" : "NO");
                    }
                });
                csv += row + "\n";
            });

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `reporte_tareas_${getToday()}.csv`;
            link.click();
        };

        // Init
        switchTab('list');
        renderTasks();

        const t = getToday();
        startInput.value = t;
        endInput.value = t;
    </script>
</body>

</html>
