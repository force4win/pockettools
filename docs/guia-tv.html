        /* ---- Guia TV internal theme variables ---- */
        .guia-wrap {
            --guia-tigo-blue: #00377d;
            --guia-tigo-accent: #00aff0;
            --guia-tigo-gold: #ffcc00;
            --guia-bg-dark: #05080c;
            --guia-card-bg: #121820;
            --guia-card-hover: #1c2530;
            --guia-text-main: #f8f9fa;
            --guia-text-dim: #94a3b8;
            --guia-fav-color: #fbbf24;
            --guia-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            min-width: 0;
            overflow-y: auto;
            overflow-x: hidden;
            background-color: var(--guia-bg-dark);
            color: var(--guia-text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            position: relative;
            border-radius: var(--radius);
        }

        .guia-wrap * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* Scrollbar Personalizado */
        .guia-wrap::-webkit-scrollbar { width: 8px; }
        .guia-wrap::-webkit-scrollbar-track { background: var(--guia-bg-dark); }
        .guia-wrap::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .guia-wrap::-webkit-scrollbar-thumb:hover { background: var(--guia-tigo-accent); }

        .guia-header-custom {
            background: linear-gradient(180deg, rgba(0, 55, 125, 0.95) 0%, rgba(5, 8, 12, 1) 100%);
            padding: 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .guia-logo-container {
            margin-bottom: 0.5rem;
        }

        .guia-logo-tigo {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .guia-logo-tigo .guia-blue { color: white; }
        .guia-logo-tigo .guia-accent { color: var(--guia-tigo-accent); }

        .guia-stats {
            font-size: 0.85rem;
            color: var(--guia-tigo-accent);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0.5rem;
        }

        .guia-controls {
            max-width: 900px;
            width: 100%;
            min-width: 0;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .guia-search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .guia-search-input {
            width: 100%;
            padding: 1rem 1.2rem;
            padding-right: 3.5rem;
            border-radius: 12px;
            border: 2px solid #1e293b;
            background: var(--guia-card-bg);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: var(--guia-transition);
            box-shadow: 0 5px 15px -5px rgba(0, 0, 0, 0.3);
        }

        .guia-search-input:focus {
            border-color: var(--guia-tigo-accent);
            background: #161e29;
            box-shadow: 0 0 0 4px rgba(0, 175, 240, 0.15);
        }

        .guia-clear-search {
            position: absolute;
            right: 1.5rem;
            background: #334155;
            border: none;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        .guia-filters-container {
            display: flex;
            flex-wrap: wrap;
            padding-bottom: 0.5rem;
            gap: 0.5rem;
            width: 100%;
            justify-content: center;
        }

        .guia-filter-btn {
            white-space: nowrap;
            padding: 0.6rem 1.5rem;
            border-radius: 12px;
            border: 1px solid #1e293b;
            background: #1e293b;
            color: var(--guia-text-dim);
            cursor: pointer;
            transition: var(--guia-transition);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .guia-filter-btn:hover {
            background: #2d3748;
            color: white;
        }

        .guia-filter-btn.active {
            background: var(--guia-tigo-accent);
            color: var(--guia-tigo-blue);
            border-color: var(--guia-tigo-accent);
        }

        .guia-filter-btn.fav-btn {
            border-color: var(--guia-fav-color);
            color: var(--guia-fav-color);
        }

        .guia-filter-btn.fav-btn.active {
            background: var(--guia-fav-color);
            color: black;
        }

        .guia-grid-container {
            max-width: 1200px;
            width: 100%;
            min-width: 0;
            margin: 0.5rem auto 5rem;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .guia-channel-card {
            background: var(--guia-card-bg);
            border-radius: 20px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1.25rem;
            transition: var(--guia-transition);
            border: 1px solid #1e293b;
            position: relative;
            cursor: pointer;
            animation: guiaSlideUp 0.4s ease-out;
        }

        @keyframes guiaSlideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .guia-channel-card:hover {
            transform: scale(1.02);
            background: var(--guia-card-hover);
            border-color: #334155;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
        }

        .guia-channel-freq {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--guia-tigo-accent);
            min-width: 70px;
            text-align: center;
            line-height: 1;
            background: rgba(0, 175, 240, 0.05);
            padding: 0.8rem 0.5rem;
            border-radius: 14px;
        }

        .guia-channel-info {
            flex-grow: 1;
            overflow: hidden;
        }

        .guia-channel-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.2rem;
        }

        .guia-channel-genre {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--guia-text-dim);
            font-weight: 700;
        }

        .guia-fav-star {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: #334155;
            cursor: pointer;
            font-size: 1.4rem;
            transition: var(--guia-transition);
        }

        .guia-fav-star.active {
            color: var(--guia-fav-color);
            transform: scale(1.2);
        }

        .guia-copy-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--guia-tigo-accent);
            color: var(--guia-tigo-blue);
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-weight: 800;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
        }

        .guia-copy-toast.show { transform: translateX(-50%) translateY(0); }

        .guia-back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--guia-tigo-blue);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 10px 15px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transition: var(--guia-transition);
            z-index: 99;
        }

        .guia-back-to-top.show { opacity: 1; pointer-events: auto; }

        .guia-no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 6rem 2rem;
            background: rgba(255,255,255,0.02);
            border-radius: 30px;
            border: 2px dashed #1e293b;
        }

        .guia-no-results i { font-size: 3rem; color: #334155; display: block; margin-bottom: 1rem; }

        @media (max-width: 640px) {
            .guia-header-custom { padding: 1rem; }
            .guia-logo-tigo { font-size: 1.6rem; }
            .guia-grid-container { grid-template-columns: 1fr; gap: 0.8rem; }
            .guia-channel-card { padding: 0.8rem; gap: 1rem; }
            .guia-channel-freq { font-size: 1.5rem; min-width: 60px; }
            .guia-channel-name { font-size: 1rem; }
            .guia-fav-star { top: 0.8rem; right: 0.8rem; }
        }
    </style>

    <script>
        // === Theme System (PocketTools) ===
        const TOOL_ID = 'guia';
        const themeBtn = document.getElementById('theme-toggle');

        function loadTheme() {
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            applyTheme(saved[TOOL_ID] || 'dark');
        }

        function toggleTheme() {
            const list = ['dark', 'light', 'matrix', 'kids', 'cyberpunk', 'nordic', 'forest'];
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            let current = saved[TOOL_ID] || 'dark';
            let idx = list.indexOf(current);
            if (idx === -1) idx = 0;
            const next = list[(idx + 1) % list.length];
            saved[TOOL_ID] = next;
            localStorage.setItem('pt_tool_themes', JSON.stringify(saved));
            applyTheme(next);
        }

        function applyTheme(theme) {
            if (theme === 'dark') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const icon = themeBtn.querySelector('i');
            icon.className = ''; icon.style.color = '';
            switch (theme) {
                case 'light': icon.className = 'fa-solid fa-sun'; icon.style.color = '#f59e0b'; break;
                case 'matrix': icon.className = 'fa-solid fa-terminal'; icon.style.color = '#00ff41'; break;
                case 'kids': icon.className = 'fa-solid fa-shapes'; icon.style.color = '#ef4444'; break;
                case 'cyberpunk': icon.className = 'fa-solid fa-robot'; icon.style.color = '#00ffff'; break;
                case 'nordic': icon.className = 'fa-regular fa-snowflake'; icon.style.color = '#88c0d0'; break;
                case 'forest': icon.className = 'fa-solid fa-tree'; icon.style.color = '#95d5b2'; break;
                default: icon.className = 'fa-solid fa-moon'; break;
            }
        }

        themeBtn.addEventListener('click', toggleTheme);
        loadTheme();

            {n: "Antena 3 HD", f: 156, g: "Internacional"},
            {n: "DW HD", f: 157, g: "Internacional"},
            {n: "TVE HD", f: 158, g: "Internacional"},
            {n: "24Hs HD", f: 159, g: "Internacional"},
            {n: "France24 HD", f: 160, g: "Internacional"},
            {n: "Euronews HD", f: 161, g: "Internacional"},
            {n: "TV 5 HD", f: 162, g: "Internacional"},
            {n: "UCL HD", f: 163, g: "Internacional"},
            {n: "RCN", f: 200, g: "Institucional"},
            {n: "Caracol", f: 201, g: "Institucional"}
        ];

        // Estado
        let currentGenre = "all";
        let searchTerm = "";
        let favorites = JSON.parse(localStorage.getItem('pt_guia_favs') || '[]');

        // DOM
        const grid = document.getElementById('guia-channels-grid');
        const searchInput = document.getElementById('guia-search-input');
        const clearSearch = document.getElementById('guia-clear-search');
        const filtersContainer = document.getElementById('guia-genre-filters');
        const countDisplay = document.getElementById('guia-channel-count');
        const toast = document.getElementById('guia-copy-toast');
        const btt = document.getElementById('guia-back-to-top');

        function init() {
            renderFilters();
            renderChannels();
            
            // Delegación de eventos para los filtros de género (Todos, Mis Canales y dinámicos)
            filtersContainer.addEventListener('click', (e) => {
                const btn = e.target.closest('.guia-filter-btn');
                if (btn) {
                    setGenre(btn.dataset.genre);
                }
            });
            
            searchInput.addEventListener('input', (e) => {
                searchTerm = e.target.value.toLowerCase();
                clearSearch.style.display = searchTerm ? 'flex' : 'none';
                renderChannels();
            });

            clearSearch.onclick = () => {
                searchInput.value = '';
                searchTerm = '';
                clearSearch.style.display = 'none';
                renderChannels();
                searchInput.focus();
            };

            const wrap = document.getElementById('guiaWrap');
            wrap.addEventListener('scroll', () => {
                btt.classList.toggle('show', wrap.scrollTop > 500);
            });
            
            btt.onclick = (e) => {
                e.preventDefault();
                wrap.scrollTo({top: 0, behavior: 'smooth'});
            };
        }

        function renderFilters() {
            const genres = [...new Set(CHANNELS_DATA.map(c => c.g))].sort();
            genres.forEach(genre => {
                const btn = document.createElement('button');
                btn.className = 'guia-filter-btn';
                btn.textContent = genre;
                btn.dataset.genre = genre;
                filtersContainer.appendChild(btn);
            });
        }

        function setGenre(genre) {
            currentGenre = genre;
            document.querySelectorAll('.guia-filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.genre === genre);
            });
            renderChannels();
        }

        window.guiaToggleFavorite = function(freq, event) {
            event.stopPropagation();
            const index = favorites.indexOf(freq);
            if (index > -1) favorites.splice(index, 1);
            else favorites.push(freq);
            
            localStorage.setItem('pt_guia_favs', JSON.stringify(favorites));
            renderChannels();
        }

        window.guiaCopyFreq = function(freq) {
            navigator.clipboard.writeText(freq).then(() => {
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2000);
            });
        }

        function renderChannels() {
            const filtered = CHANNELS_DATA.filter(c => {
                const isFav = favorites.includes(c.f);
                const matchesGenre = currentGenre === "all" || 
                                   (currentGenre === "favs" && isFav) || 
                                   c.g === currentGenre;
                const matchesSearch = c.n.toLowerCase().includes(searchTerm) || 
                                    c.f.toString().includes(searchTerm) ||
                                    c.g.toLowerCase().includes(searchTerm);
                return matchesGenre && matchesSearch;
            });

            grid.innerHTML = '';
            
            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="guia-no-results">
                        <i>🔍</i>
                        <p>No encontramos nada para "${searchTerm}"</p>
                        <small>Prueba buscando por género (ej: Cine) o número.</small>
                    </div>`;
            } else {
                filtered.forEach(c => {
                    const isFav = favorites.includes(c.f);
                    const card = document.createElement('div');
                    card.className = 'guia-channel-card';
                    card.onclick = () => window.guiaCopyFreq(c.f);
                    card.innerHTML = `
                        <div class="guia-channel-freq">${c.f}</div>
                        <div class="guia-channel-info">
                            <div class="guia-channel-name">${c.n}</div>
                            <div class="guia-channel-genre">${c.g}</div>
                        </div>
                        <button class="guia-fav-star ${isFav ? 'active' : ''}" 
                                onclick="window.guiaToggleFavorite(${c.f}, event)">
                            ${isFav ? '★' : '☆'}
                        </button>
                    `;
                    grid.appendChild(card);
                });
            }

            countDisplay.textContent = `${filtered.length} canales disponibles`;
        }

        init();
    </script>
</body>
</html>
