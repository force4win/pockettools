<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PocketTools | Generador Pass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container tool-view active">
        <div class="tool-header">
            <a href="index.html" class="back-btn" aria-label="Volver">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="tool-title" style="flex:1;">Generador Pass</h2>
            <button id="theme-toggle" class="secondary-btn" aria-label="Cambiar Tema"
                style="padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div id="tool-content" style="flex: 1; display: flex; flex-direction: column;">
            <div class="input-group">
                <div class="counter-display" id="pass-display"
                    style="font-size: 2rem; margin: 20px 0; word-break: break-all; min-height: 60px;">---</div>
                <button class="primary-btn" id="generate-btn" style="margin-bottom: 24px;">
                    <i class="fa-solid fa-shuffle"></i> Generar Nueva
                </button>

                <label>Longitud: <span id="len-val">12</span></label>
                <input type="range" id="pass-length" min="6" max="32" value="12">

                <div style="margin-top: 16px; display: grid; gap: 12px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="use-caps" checked style="width: auto;"> Mayúsculas (A-Z)
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="use-nums" checked style="width: auto;"> Números (0-9)
                    </label>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="use-syms" style="width: auto;"> Símbolos (!@#$)
                    </label>
                </div>
            </div>
        </div>
    </div>

    <script>
        // === Theme System ===
        const TOOL_ID = 'password';
        const themeBtn = document.getElementById('theme-toggle');

        function loadTheme() {
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            applyTheme(saved[TOOL_ID] || 'dark');
        }

        function toggleTheme() {
            const list = ['dark', 'light', 'matrix', 'kids', 'cyberpunk', 'nordic', 'forest'];
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            let current = saved[TOOL_ID] || 'dark';
            let idx = list.indexOf(current);
            if (idx === -1) idx = 0;
            const next = list[(idx + 1) % list.length];
            saved[TOOL_ID] = next;
            localStorage.setItem('pt_tool_themes', JSON.stringify(saved));
            applyTheme(next);
        }

        function applyTheme(theme) {
            if (theme === 'dark') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const icon = themeBtn.querySelector('i');
            icon.className = ''; icon.style.color = '';
            switch (theme) {
                case 'light': icon.className = 'fa-solid fa-sun'; icon.style.color = '#f59e0b'; break;
                case 'matrix': icon.className = 'fa-solid fa-terminal'; icon.style.color = '#00ff41'; break;
                case 'kids': icon.className = 'fa-solid fa-shapes'; icon.style.color = '#ef4444'; break;
                case 'cyberpunk': icon.className = 'fa-solid fa-robot'; icon.style.color = '#00ffff'; break;
                case 'nordic': icon.className = 'fa-regular fa-snowflake'; icon.style.color = '#88c0d0'; break;
                case 'forest': icon.className = 'fa-solid fa-tree'; icon.style.color = '#95d5b2'; break;
                default: icon.className = 'fa-solid fa-moon'; break;
            }
        }

        themeBtn.addEventListener('click', toggleTheme);
        loadTheme();

        // === Tool Logic ===
        const passDisplay = document.getElementById('pass-display');
        const lengthSlider = document.getElementById('pass-length');
        const lenVal = document.getElementById('len-val');
        const generateBtn = document.getElementById('generate-btn');

        const getOptions = () => ({
            length: parseInt(lengthSlider.value),
            caps: document.getElementById('use-caps').checked,
            nums: document.getElementById('use-nums').checked,
            syms: document.getElementById('use-syms').checked
        });

        const generate = () => {
            const opts = getOptions();
            let charSet = 'abcdefghijklmnopqrstuvwxyz';
            if (opts.caps) charSet += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (opts.nums) charSet += '0123456789';
            if (opts.syms) charSet += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            let pass = '';
            for (let i = 0; i < opts.length; i++) {
                pass += charSet.charAt(Math.floor(Math.random() * charSet.length));
            }
            passDisplay.textContent = pass;
        };

        lengthSlider.oninput = () => {
            lenVal.textContent = lengthSlider.value;
        };

        generateBtn.onclick = generate;
        generate();
    </script>
</body>

</html>
