<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PocketTools | Control Gasolina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Stat Cards Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .stat-value.highlight {
            color: var(--primary-color);
        }

        /* Input Wrapper with prefix/suffix */
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--input-bg, rgba(0, 0, 0, 0.2));
            border: 1px solid var(--border-color);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary-color) 25%, transparent);
        }

        .input-prefix,
        .input-suffix {
            padding: 0 10px;
            color: var(--text-muted);
            font-weight: 600;
            user-select: none;
            font-size: 0.9rem;
        }

        .input-prefix {
            padding-right: 0;
        }

        .input-suffix {
            padding-left: 0;
        }

        .input-wrapper input {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 10px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            width: 100%;
            font-family: inherit;
        }

        /* Form Panel */
        .form-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* History as Cards */
        .log-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .log-list::-webkit-scrollbar {
            width: 4px;
        }

        .log-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }

        .log-item {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px;
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 10px;
            transition: transform 0.2s;
        }

        .log-item:hover {
            transform: scale(1.01);
        }

        .log-item.reset-log {
            background: color-mix(in srgb, var(--accent-color, #10b981) 10%, transparent);
            border: 1px dashed var(--accent-color, #10b981);
            grid-template-columns: 1fr;
            text-align: center;
            padding: 10px;
        }

        .log-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-date {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .log-stats {
            display: flex;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .log-efficiency {
            font-weight: 600;
            color: var(--accent-color, #10b981);
            font-size: 1rem;
        }

        .log-cost {
            font-weight: 600;
            color: var(--text-color);
            font-size: 1rem;
            text-align: right;
        }

        .btn-log-delete {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
            font-size: 0.9rem;
        }

        .btn-log-delete:hover {
            color: #ef4444;
        }

        .btn-cierre {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-cierre:hover {
            background: #ef4444;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 32px;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="app-container tool-view active">
        <div class="tool-header">
            <a href="index.html" class="back-btn" aria-label="Volver">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="tool-title" style="flex:1;">Control Gasolina</h2>
            <button id="theme-toggle" class="secondary-btn" aria-label="Cambiar Tema"
                style="padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div id="tool-content" style="flex: 1; display: flex; flex-direction: column;">
            <!-- Stats Dashboard -->
            <div class="dashboard-grid">
                <div class="stat-card">
                    <span class="stat-label">Eficiencia</span>
                    <span class="stat-value highlight" id="statEff">0 Km/Gal</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Costo Total</span>
                    <span class="stat-value" id="statCost">$0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Distancia</span>
                    <span class="stat-value" id="statDist">0 Km</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Galones</span>
                    <span class="stat-value" id="statGal">0</span>
                </div>
            </div>

            <!-- Input Form -->
            <div class="form-panel">
                <div class="input-group" style="margin:0;">
                    <label>Fecha y Hora</label>
                    <input type="datetime-local" id="fuel-date" class="glass-input" step="1">
                </div>
                <div class="form-row">
                    <div class="input-group" style="margin:0;">
                        <label>Distancia</label>
                        <div class="input-wrapper">
                            <input type="number" id="fuel-dist" placeholder="0">
                            <span class="input-suffix">Km</span>
                        </div>
                    </div>
                    <div class="input-group" style="margin:0;">
                        <label>Galones</label>
                        <div class="input-wrapper">
                            <input type="text" id="fuel-gal" placeholder="0,000" inputmode="decimal">
                            <span class="input-suffix">Gal</span>
                        </div>
                    </div>
                </div>
                <div class="input-group" style="margin:0;">
                    <label>Costo</label>
                    <div class="input-wrapper">
                        <span class="input-prefix">$</span>
                        <input type="text" id="fuel-cost" placeholder="0" inputmode="numeric">
                    </div>
                </div>
                <button class="primary-btn" id="fuel-add-btn">
                    <i class="fa-solid fa-plus"></i> Guardar Tanqueo
                </button>
            </div>

            <!-- History -->
            <div style="flex: 1; display: flex; flex-direction: column;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <h3 style="margin: 0;">Historial</h3>
                    <button class="btn-cierre" id="fuel-reset-btn">
                        <i class="fa-solid fa-scissors"></i> Cerrar Periodo
                    </button>
                </div>
                <div class="log-list" id="fuel-list"></div>
            </div>
        </div>
    </div>

    <script>
        // === Theme System ===
        const TOOL_ID = 'fuel';
        const themeBtn = document.getElementById('theme-toggle');

        function loadTheme() {
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            applyTheme(saved[TOOL_ID] || 'dark');
        }

        function toggleTheme() {
            const list = ['dark', 'light', 'matrix', 'kids', 'cyberpunk', 'nordic', 'forest'];
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            let current = saved[TOOL_ID] || 'dark';
            let idx = list.indexOf(current);
            if (idx === -1) idx = 0;
            const next = list[(idx + 1) % list.length];
            saved[TOOL_ID] = next;
            localStorage.setItem('pt_tool_themes', JSON.stringify(saved));
            applyTheme(next);
        }

        function applyTheme(theme) {
            if (theme === 'dark') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const icon = themeBtn.querySelector('i');
            icon.className = ''; icon.style.color = '';
            switch (theme) {
                case 'light': icon.className = 'fa-solid fa-sun'; icon.style.color = '#f59e0b'; break;
                case 'matrix': icon.className = 'fa-solid fa-terminal'; icon.style.color = '#00ff41'; break;
                case 'kids': icon.className = 'fa-solid fa-shapes'; icon.style.color = '#ef4444'; break;
                case 'cyberpunk': icon.className = 'fa-solid fa-robot'; icon.style.color = '#00ffff'; break;
                case 'nordic': icon.className = 'fa-regular fa-snowflake'; icon.style.color = '#88c0d0'; break;
                case 'forest': icon.className = 'fa-solid fa-tree'; icon.style.color = '#95d5b2'; break;
                default: icon.className = 'fa-solid fa-moon'; break;
            }
        }

        themeBtn.addEventListener('click', toggleTheme);
        loadTheme();

        // === Formatters ===
        const currencyFmt = new Intl.NumberFormat('es-CO', {
            style: 'currency',
            currency: 'COP',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        });

        function formatCurrency(value) {
            return currencyFmt.format(value);
        }

        // === Input Masks ===
        const costInput = document.getElementById('fuel-cost');
        const galInput = document.getElementById('fuel-gal');

        // Cost: currency mask ($1.234)
        costInput.addEventListener('input', () => {
            let raw = costInput.value.replace(/[^\d]/g, '');
            if (raw === '') { costInput.value = ''; return; }
            const num = parseInt(raw, 10);
            costInput.value = num.toLocaleString('es-CO');
        });

        // Gallons: decimal mask with comma (1,500)
        galInput.addEventListener('input', () => {
            let val = galInput.value;
            // Only allow digits and single comma
            val = val.replace(/[^\d,]/g, '');
            const parts = val.split(',');
            if (parts.length > 2) val = parts[0] + ',' + parts.slice(1).join('');
            if (parts[1] && parts[1].length > 3) val = parts[0] + ',' + parts[1].slice(0, 3);
            galInput.value = val;
        });

        function parseCost(str) {
            return parseFloat(str.replace(/[^\d]/g, '')) || 0;
        }

        function parseGallons(str) {
            return parseFloat(str.replace(',', '.')) || 0;
        }

        // === Tool Logic ===
        const dateInput = document.getElementById('fuel-date');
        const distInput = document.getElementById('fuel-dist');
        const addBtn = document.getElementById('fuel-add-btn');
        const resetBtn = document.getElementById('fuel-reset-btn');
        const listEl = document.getElementById('fuel-list');

        // Stat card elements
        const statEff = document.getElementById('statEff');
        const statCost = document.getElementById('statCost');
        const statDist = document.getElementById('statDist');
        const statGal = document.getElementById('statGal');

        const setNowBogota = () => {
            const now = new Date();
            const bogotaStr = now.toLocaleString('sv-SE', { timeZone: 'America/Bogota' }).replace(' ', 'T');
            dateInput.value = bogotaStr;
        };

        setNowBogota();

        let logs = JSON.parse(localStorage.getItem('pt_fuel_logs') || '[]');

        // Migrate old logs without ID
        logs.forEach((log, i) => {
            if (!log.id) log.id = Date.now() + i;
        });

        function fuelRemove(id) {
            if (confirm('¿Borrar registro?')) {
                logs = logs.filter(l => l.id !== id);
                save();
                render();
            }
        }

        window.fuelRemove = fuelRemove;

        const render = () => {
            logs.sort((a, b) => new Date(b.date) - new Date(a.date));

            let headerCost = 0;
            let headerDist = 0;
            let headerGal = 0;
            let countingForHeader = true;

            listEl.innerHTML = '';

            if (logs.length === 0) {
                listEl.innerHTML = '<div class="empty-state">Sin registros</div>';
                statEff.textContent = '0 Km/Gal';
                statCost.textContent = '$0';
                statDist.textContent = '0 Km';
                statGal.textContent = '0';
                return;
            }

            logs.forEach(log => {
                if (log.type === 'reset') {
                    countingForHeader = false;

                    const dateObj = new Date(log.date);
                    const dateStr = dateObj.toLocaleDateString('es-CO', { day: '2-digit', month: '2-digit', year: '2-digit' });
                    const eff = log.totalGal > 0 ? (log.totalDist / log.totalGal).toFixed(1) : '0';

                    const item = document.createElement('div');
                    item.className = 'log-item reset-log';
                    item.innerHTML = `
                        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                            <span><i class="fa-solid fa-scissors"></i> Cierre ${dateStr}</span>
                            <button class="btn-log-delete" onclick="fuelRemove(${log.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <div style="font-size: 0.85rem; margin-top: 6px; display: flex; justify-content: space-around; width: 100%; flex-wrap: wrap; gap: 4px;">
                            <span>${formatCurrency(log.totalCost)}</span>
                            <span>${parseFloat(log.totalDist).toLocaleString()} Km</span>
                            <span>${parseFloat(log.totalGal).toFixed(3)} Gal</span>
                            <span>Avg: ${eff} K/G</span>
                        </div>
                    `;
                    listEl.appendChild(item);
                    return;
                }

                if (countingForHeader) {
                    headerCost += parseFloat(log.cost || 0);
                    headerDist += parseFloat(log.dist || 0);
                    headerGal += parseFloat(log.gal || 0);
                }

                const dateObj = new Date(log.date);
                const dateStr = dateObj.toLocaleString('es-CO', {
                    timeZone: 'America/Bogota',
                    day: '2-digit', month: '2-digit', year: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });

                const efficiency = (log.dist / log.gal).toFixed(1);

                const item = document.createElement('div');
                item.className = 'log-item';
                item.innerHTML = `
                    <div class="log-main">
                        <div class="log-date">${dateStr}</div>
                        <div class="log-stats">
                            <span>${log.dist} Km</span>
                            <span>·</span>
                            <span>${parseFloat(log.gal).toFixed(3)} Gal</span>
                        </div>
                    </div>
                    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px;">
                        <div class="log-efficiency">${efficiency} K/G</div>
                        <div class="log-cost">${formatCurrency(log.cost)}</div>
                    </div>
                    <button class="btn-log-delete" onclick="fuelRemove(${log.id})">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                `;
                listEl.appendChild(item);
            });

            // Update stat cards
            const eff = headerGal > 0 ? (headerDist / headerGal).toFixed(1) : '0';
            statEff.textContent = `${eff} Km/Gal`;
            statCost.textContent = formatCurrency(headerCost);
            statDist.textContent = `${headerDist.toLocaleString()} Km`;
            statGal.textContent = headerGal.toFixed(3);
        };

        const add = () => {
            const date = dateInput.value;
            const dist = parseFloat(distInput.value);
            const gal = parseGallons(galInput.value);
            const cost = parseCost(costInput.value);

            if (!date || !dist || dist <= 0 || !gal || gal <= 0 || !cost || cost <= 0) {
                alert('Por favor completa todos los campos con valores mayores a 0.');
                return;
            }

            logs.push({
                id: Date.now(),
                type: 'log',
                date,
                dist,
                gal,
                cost
            });

            save();
            distInput.value = '';
            galInput.value = '';
            costInput.value = '';
            setNowBogota();
            render();
        };

        const addReset = () => {
            let currentCost = 0;
            let currentDist = 0;
            let currentGal = 0;

            const sortedLogs = [...logs].sort((a, b) => new Date(b.date) - new Date(a.date));

            for (const log of sortedLogs) {
                if (log.type === 'reset') break;
                currentCost += parseFloat(log.cost || 0);
                currentDist += parseFloat(log.dist || 0);
                currentGal += parseFloat(log.gal || 0);
            }

            if (currentCost === 0 && currentDist === 0 && currentGal === 0) {
                alert('No hay datos para cerrar en este periodo.');
                return;
            }

            if (!confirm(`¿Cerrar periodo actual?\n\nTotales:\n${formatCurrency(currentCost)}\n${currentDist} Km\n${currentGal.toFixed(3)} Gal`)) return;

            const now = new Date();
            const bogotaStr = now.toLocaleString('sv-SE', { timeZone: 'America/Bogota' }).replace(' ', 'T');

            logs.push({
                id: Date.now(),
                type: 'reset',
                date: bogotaStr,
                totalCost: currentCost,
                totalDist: currentDist,
                totalGal: currentGal
            });

            save();
            render();
        };

        const save = () => {
            localStorage.setItem('pt_fuel_logs', JSON.stringify(logs));
        };

        addBtn.onclick = add;
        resetBtn.onclick = addReset;
        render();
    </script>
</body>

</html>
