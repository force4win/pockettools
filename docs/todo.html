<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PocketTools | Lista Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container tool-view active">
        <div class="tool-header">
            <a href="index.html" class="back-btn" aria-label="Volver">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h2 class="tool-title" style="flex:1;">Lista Tareas</h2>
            <button id="theme-toggle" class="secondary-btn" aria-label="Cambiar Tema"
                style="padding: 8px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>

        <div id="tool-content" style="flex: 1; display: flex; flex-direction: column;">
            <div class="input-group" style="display: flex; gap: 8px;">
                <input type="text" id="todo-input" placeholder="Nueva tarea...">
                <button class="primary-btn" id="todo-add" style="width: auto;"><i class="fa-solid fa-plus"></i></button>
            </div>
            <ul id="todo-list" style="list-style: none; padding: 0;"></ul>
        </div>
    </div>

    <script>
        // === Theme System ===
        const TOOL_ID = 'todo';
        const themeBtn = document.getElementById('theme-toggle');

        function loadTheme() {
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            applyTheme(saved[TOOL_ID] || 'dark');
        }

        function toggleTheme() {
            const list = ['dark', 'light', 'matrix', 'kids', 'cyberpunk', 'nordic', 'forest'];
            const saved = JSON.parse(localStorage.getItem('pt_tool_themes') || '{}');
            let current = saved[TOOL_ID] || 'dark';
            let idx = list.indexOf(current);
            if (idx === -1) idx = 0;
            const next = list[(idx + 1) % list.length];
            saved[TOOL_ID] = next;
            localStorage.setItem('pt_tool_themes', JSON.stringify(saved));
            applyTheme(next);
        }

        function applyTheme(theme) {
            if (theme === 'dark') document.documentElement.removeAttribute('data-theme');
            else document.documentElement.setAttribute('data-theme', theme);
            updateThemeIcon(theme);
        }

        function updateThemeIcon(theme) {
            const icon = themeBtn.querySelector('i');
            icon.className = ''; icon.style.color = '';
            switch (theme) {
                case 'light': icon.className = 'fa-solid fa-sun'; icon.style.color = '#f59e0b'; break;
                case 'matrix': icon.className = 'fa-solid fa-terminal'; icon.style.color = '#00ff41'; break;
                case 'kids': icon.className = 'fa-solid fa-shapes'; icon.style.color = '#ef4444'; break;
                case 'cyberpunk': icon.className = 'fa-solid fa-robot'; icon.style.color = '#00ffff'; break;
                case 'nordic': icon.className = 'fa-regular fa-snowflake'; icon.style.color = '#88c0d0'; break;
                case 'forest': icon.className = 'fa-solid fa-tree'; icon.style.color = '#95d5b2'; break;
                default: icon.className = 'fa-solid fa-moon'; break;
            }
        }

        themeBtn.addEventListener('click', toggleTheme);
        loadTheme();

        // === Tool Logic ===
        const input = document.getElementById('todo-input');
        const addBtn = document.getElementById('todo-add');
        const listEl = document.getElementById('todo-list');

        let todos = JSON.parse(localStorage.getItem('pt_todos') || '[]');

        function todoToggle(index) {
            todos[index].done = !todos[index].done;
            save();
            render();
        }

        function todoRemove(index) {
            todos.splice(index, 1);
            save();
            render();
        }

        // Expose globally for inline onclick
        window.todoToggle = todoToggle;
        window.todoRemove = todoRemove;

        const render = () => {
            listEl.innerHTML = todos.map((t, index) => `
                <li style="background: rgba(255,255,255,0.05); padding: 12px; margin-bottom: 8px; border-radius: 8px; display: flex; align-items: center; justify-content: space-between;">
                    <span style="text-decoration: ${t.done ? 'line-through' : 'none'}; opacity: ${t.done ? 0.5 : 1}; cursor: pointer;" onclick="todoToggle(${index})">
                        ${t.text}
                    </span>
                    <button onclick="todoRemove(${index})" style="background: none; border: none; color: #ef4444; cursor: pointer;">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </li>
            `).join('');
        };

        const add = () => {
            if (!input.value.trim()) return;
            todos.push({ text: input.value, done: false });
            save();
            input.value = '';
            render();
        };

        const save = () => {
            localStorage.setItem('pt_todos', JSON.stringify(todos));
        };

        addBtn.onclick = add;
        input.onkeypress = (e) => { if (e.key === 'Enter') add(); };
        render();
    </script>
</body>

</html>
